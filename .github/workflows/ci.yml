name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meeting_notes
          POSTGRES_USER: meeting_notes
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeting_notes -d meeting_notes"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://meeting_notes:test-password@localhost:5432/meeting_notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API
        run: pip install -e 'apps/api[dev]'
      - name: Install FFmpeg for the long fixture
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lint and format
        run: ruff check apps/api && ruff format --check apps/api
      - name: API tests
        run: pytest -q apps/api/tests
      - name: PostgreSQL migrations
        run: alembic -c apps/api/alembic.ini upgrade head && alembic -c apps/api/alembic.ini check
      - name: Build API and worker image
        run: docker build -f apps/api/Dockerfile -t meeting-notes-api:ci .
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web
        run: npm ci
        working-directory: apps/web
      - name: Lint, typecheck, build
        run: npm run lint && npm run typecheck && npm run build
        working-directory: apps/web
