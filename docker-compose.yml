services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: meeting_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: meeting_notes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_notes -d meeting_notes"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
