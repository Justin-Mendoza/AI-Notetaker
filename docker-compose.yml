services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: meeting_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: meeting_notes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_notes -d meeting_notes"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${BUCKET_ACCESS_KEY:-change-me}
      MINIO_ROOT_PASSWORD: ${BUCKET_SECRET_KEY:-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      BUCKET_ACCESS_KEY: ${BUCKET_ACCESS_KEY:-change-me}
      BUCKET_SECRET_KEY: ${BUCKET_SECRET_KEY:-change-me}
      BUCKET_NAME: ${BUCKET_NAME:-meeting-audio}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      until mc alias set local http://minio:9000 "$$BUCKET_ACCESS_KEY" "$$BUCKET_SECRET_KEY"; do sleep 2; done
      mc mb --ignore-existing "local/$$BUCKET_NAME"
      mc anonymous set none "local/$$BUCKET_NAME"
volumes:
  postgres_data:
  minio_data:
